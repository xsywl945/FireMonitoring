logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997
metrics: yes
metricsAddress: :9998
playback: yes
playbackAddress: :9996

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: yes
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: [127.0.0.1, localhost]

# Docker sees requests from the Windows host through its bridge address rather
# than 127.0.0.1. These endpoints remain host-only because compose.yaml binds
# ports 9997/9998 to 127.0.0.1.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
      - action: api
      - action: metrics

pathDefaults:
  source: publisher
  overridePublisher: true
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordMaxPartSize: 50M
  recordSegmentDuration: 5s
  recordDeleteAfter: 10m

paths:
  all_others:
