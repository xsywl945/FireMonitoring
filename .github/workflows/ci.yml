name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e "apps/server[dev]" "opencv-python>=4.10,<5" "scipy>=1.11,<2"
      - run: python -m pytest apps/server/tests

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e "apps/inference[dev]"
      - run: python -m pytest apps/inference

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cp config.example.json config.json
      - working-directory: apps/web
        run: npm ci && npm run build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: g++ -std=c++17 -I firmware/tests -o /tmp/protocol_test firmware/tests/protocol_test.cpp && /tmp/protocol_test

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6.0,<7" "Pillow>=10.4,<12" "ImageHash>=4.3,<5" "pytest>=8.3,<9"
      - run: python -m pytest ml/tests
