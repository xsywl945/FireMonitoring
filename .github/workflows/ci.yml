name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e "apps/server[dev]" "opencv-python>=4.10,<5" "scipy>=1.11,<2"
      - run: python -m pytest apps/server/tests

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e "apps/inference[dev]"
      - run: python -m pytest apps/inference

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cp config.example.json config.json
      - working-directory: apps/web
        run: npm ci && npm run build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          g++ -std=c++17 -I firmware/tests -I firmware/esp32_actuator/src -o /tmp/actuator_test firmware/esp32_actuator/src/actuator.cpp firmware/tests/actuator_protocol_test.cpp
          /tmp/actuator_test
          g++ -std=c++17 -I firmware/tests -I firmware/esp32_panel/src -o /tmp/panel_test firmware/esp32_panel/src/panel.cpp firmware/tests/display_stub.cpp firmware/tests/panel_protocol_test.cpp
          /tmp/panel_test
      - run: python -m pip install platformio
      - run: |
          python -m platformio run -d firmware/esp32_actuator
          python -m platformio run -d firmware/esp32_panel

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6.0,<7" "Pillow>=10.4,<12" "ImageHash>=4.3,<5" "pytest>=8.3,<9"
      - run: python -m pytest ml/tests
