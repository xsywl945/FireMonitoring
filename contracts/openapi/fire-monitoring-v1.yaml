openapi: 3.1.0
info:
  title: Fire Monitoring Business API
  version: 1.0.0
  description: Contract between the Vue operator console and Spring Boot business service.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /incidents/analyses:
    get:
      operationId: listIncidentAnalyses
      responses:
        '200':
          description: Semantic review records for published incidents, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentAnalysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /zones:
    get:
      operationId: listZones
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
    post:
      operationId: createZone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneUpsert'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
  /zones/{zoneId}:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      operationId: updateZone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneUpsert'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteZone
      description: Disable room and remove camera bindings while preserving incidents.
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /zones/{zoneId}/camera-bindings:
    put:
      operationId: replaceZoneCameraBindings
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 0
              maxItems: 2
              items:
                $ref: '#/components/schemas/CameraBinding'
      responses:
        '204':
          description: Updated
  /cameras:
    get:
      operationId: listCameras
      responses:
        '200':
          description: Cameras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Camera'
    post:
      operationId: createCamera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraUpsert'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
  /cameras/local-devices:
    get:
      operationId: listLocalCameraDevices
      responses:
        '200':
          description: Local DirectShow camera list, each item contains index and name
  /cameras/{cameraId}/start:
    post:
      operationId: startLocalCamera
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      description: Start the saved local device for its bound room. Poll inference runtime for readiness.
      responses:
        '202':
          description: Camera starting
        '409':
          description: Another camera is running
  /cameras/local-stop:
    post:
      operationId: stopLocalCamera
      responses:
        '200':
          description: Camera released and buffered frames cleared
        '409':
          description: Stop still in progress; retry before switching cameras
  /cameras/{cameraId}:
    parameters:
      - name: cameraId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      operationId: updateCamera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraUpsert'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCamera
      description: Remove camera and its room bindings.
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /cameras/{cameraId}/probe:
    post:
      operationId: probeCamera
      parameters:
        - $ref: '#/components/parameters/CameraId'
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraProbeResult'
  /cameras/{cameraId}/stream-ticket:
    post:
      operationId: createStreamTicket
      parameters:
        - $ref: '#/components/parameters/CameraId'
      responses:
        '200':
          description: Short-lived stream URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamTicket'
  /incidents:
    get:
      operationId: listIncidents
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/Severity'
      responses:
        '200':
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentSummary'
  /incidents/{incidentId}:
    get:
      operationId: getIncident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Incident detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
  /incidents/{incidentId}/actions:
    post:
      operationId: transitionIncident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentActionRequest'
      responses:
        '200':
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
  /incidents/{incidentId}/evidence/{evidenceIndex}:
    get:
      operationId: getIncidentEvidence
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: evidenceIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Private incident evidence image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CameraId:
      name: cameraId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Unauthorized:
      description: Authentication failed
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 6
          maxLength: 100
    AuthResponse:
      type: object
      required: [accessToken, expiresInSeconds, user]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, username, displayName, roles]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [ADMIN, OPERATOR, VIEWER]
    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    IncidentStatus:
      type: string
      enum: [NEW, ACKNOWLEDGED, HANDLING, RESOLVED, FALSE_ALARM]
    CameraStatus:
      type: string
      enum: [ONLINE, OFFLINE, DEGRADED, UNKNOWN]
    Zone:
      type: object
      required: [id, name, sceneType, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sceneType:
          type: string
          enum: [CLASSROOM, LABORATORY, CORRIDOR, OTHER]
        status:
          type: string
          enum: [ENABLED, DISABLED]
    ZoneUpsert:
      type: object
      additionalProperties: false
      required: [name, sceneType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sceneType:
          type: string
          enum: [CLASSROOM, LABORATORY, CORRIDOR, OTHER]
    CameraBinding:
      type: object
      additionalProperties: false
      required: [cameraId, viewRole, weight]
      properties:
        cameraId:
          type: integer
          format: int64
        viewRole:
          type: string
          enum: [VIEW_A, VIEW_B, SINGLE]
        weight:
          type: number
          minimum: 0
          maximum: 1
    Camera:
      type: object
      required: [id, name, sourceType, streamKey, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sourceType:
          type: string
          enum: [INTEGRATED, USB, NETWORK_RTSP, DEMO_FILE]
        targetFps:
          type: number
        streamKey:
          type: string
        maskedSource:
          type: string
        status:
          $ref: '#/components/schemas/CameraStatus'
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        zoneId:
          type: [integer, 'null']
          format: int64
        viewRole:
          type: [string, 'null']
          enum: [VIEW_A, VIEW_B, SINGLE, null]
    CameraUpsert:
      type: object
      additionalProperties: false
      required: [name, sourceType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sourceType:
          type: string
          enum: [INTEGRATED, USB, NETWORK_RTSP, DEMO_FILE]
        sourceUri:
          type: string
          maxLength: 1000
        targetFps:
          type: number
          minimum: 1
          maximum: 30
          default: 5
    CameraProbeResult:
      type: object
      required: [reachable, configurationValid, checkedAt]
      properties:
        configurationValid:
          type: boolean
        reachable:
          type: boolean
          description: Configuration checks do not prove video connectivity.
        checkedAt:
          type: string
          format: date-time
        width:
          type: integer
        height:
          type: integer
        fps:
          type: number
        message:
          type: string
    StreamTicket:
      type: object
      required: [expiresAt, whepUrl, hlsUrl]
      properties:
        expiresAt:
          type: string
          format: date-time
        whepUrl:
          type: string
          format: uri
        hlsUrl:
          type: string
          format: uri
    Detection:
      type: object
      required: [className, confidence, bboxXyxy]
      properties:
        className:
          type: string
          enum: [fire, smoke]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        bboxXyxy:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
    IncidentSummary:
      type: object
      required: [id, zoneId, zoneName, status, severity, primaryType, startedAt]
      properties:
        id:
          type: integer
          format: int64
        zoneId:
          type: integer
          format: int64
        zoneName:
          type: string
        status:
          $ref: '#/components/schemas/IncidentStatus'
        severity:
          $ref: '#/components/schemas/Severity'
        primaryType:
          type: string
          enum: [FIRE, SMOKE, FIRE_AND_SMOKE]
        startedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: [string, 'null']
          format: date-time
    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/IncidentSummary'
        - type: object
          properties:
            fusionScore:
              type: number
            observations:
              type: array
              items:
                $ref: '#/components/schemas/IncidentObservation'
            semanticAnalysis:
              oneOf:
                - $ref: '#/components/schemas/SemanticAnalysis'
                - type: 'null'
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/TimelineEntry'
    IncidentObservation:
      type: object
      additionalProperties: false
      required: [id, cameraId, viewRole, capturedAt, cameraName, imageWidth, imageHeight, detections, temporalScore, snapshotAvailable]
      properties:
        id:
          type: string
        cameraId:
          type: [integer, 'null']
          format: int64
        viewRole:
          type: string
          enum: [VIEW_A, VIEW_B, SINGLE]
        capturedAt:
          type: string
          format: date-time
        cameraName:
          type: string
        imageWidth:
          type: integer
          minimum: 1
        imageHeight:
          type: integer
          minimum: 1
        detections:
          type: array
          items:
            $ref: '#/components/schemas/Detection'
        temporalScore:
          type: number
          minimum: 0
          maximum: 1
        snapshotAvailable:
          type: boolean
    SemanticAnalysis:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
        summary:
          type: string
        sourceNature:
          type: string
        sceneRisk:
          type: string
        recommendations:
          type: array
          items:
            type: string
        uncertainty:
          type: string
        model:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        errorCode:
          type: string
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [id, action, actor, occurredAt]
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
        actor:
          type: string
        note:
          type: [string, 'null']
        falseAlarmReason:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time
    IncidentActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [ACKNOWLEDGE, START_HANDLING, RESOLVE, MARK_FALSE_ALARM]
        note:
          type: string
          maxLength: 2000
        falseAlarmReason:
          type: string
          enum: [STEAM, DUST, LIGHT, SCREEN_CONTENT, OTHER]
    IncidentAnalysis:
      type: object
      required: [incident, semanticAnalysis]
      properties:
        incident:
          $ref: '#/components/schemas/IncidentSummary'
        semanticAnalysis:
          oneOf:
            - $ref: '#/components/schemas/SemanticAnalysis'
            - type: 'null'
