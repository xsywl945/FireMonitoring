openapi: 3.1.0
info:
  title: Fire Monitoring Business API
  version: 1.0.0
  description: Contract between the Vue operator console and Spring Boot business service.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
  /zones:
    get:
      operationId: listZones
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
    post:
      operationId: createZone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneUpsert'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
  /zones/{zoneId}/camera-bindings:
    put:
      operationId: replaceZoneCameraBindings
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 2
              items:
                $ref: '#/components/schemas/CameraBinding'
      responses:
        '204':
          description: Updated
  /cameras:
    get:
      operationId: listCameras
      responses:
        '200':
          description: Cameras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Camera'
    post:
      operationId: createCamera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraUpsert'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
  /cameras/{cameraId}/probe:
    post:
      operationId: probeCamera
      parameters:
        - $ref: '#/components/parameters/CameraId'
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraProbeResult'
  /cameras/{cameraId}/stream-ticket:
    post:
      operationId: createStreamTicket
      parameters:
        - $ref: '#/components/parameters/CameraId'
      responses:
        '200':
          description: Short-lived stream URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamTicket'
  /incidents:
    get:
      operationId: listIncidents
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/Severity'
      responses:
        '200':
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentSummary'
  /incidents/{incidentId}:
    get:
      operationId: getIncident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Incident detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
  /incidents/{incidentId}/actions:
    post:
      operationId: transitionIncident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentActionRequest'
      responses:
        '200':
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CameraId:
      name: cameraId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Unauthorized:
      description: Authentication failed
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 100
    AuthResponse:
      type: object
      required: [accessToken, expiresInSeconds, user]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, username, displayName, roles]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [ADMIN, OPERATOR, VIEWER]
    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    IncidentStatus:
      type: string
      enum: [NEW, ACKNOWLEDGED, HANDLING, RESOLVED, FALSE_ALARM]
    CameraStatus:
      type: string
      enum: [ONLINE, OFFLINE, DEGRADED, UNKNOWN]
    Zone:
      type: object
      required: [id, name, sceneType, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sceneType:
          type: string
          enum: [CLASSROOM, LABORATORY, CORRIDOR, OTHER]
        status:
          type: string
          enum: [ENABLED, DISABLED]
    ZoneUpsert:
      type: object
      additionalProperties: false
      required: [name, sceneType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sceneType:
          type: string
          enum: [CLASSROOM, LABORATORY, CORRIDOR, OTHER]
    CameraBinding:
      type: object
      additionalProperties: false
      required: [cameraId, viewRole, weight]
      properties:
        cameraId:
          type: integer
          format: int64
        viewRole:
          type: string
          enum: [VIEW_A, VIEW_B]
        weight:
          type: number
          minimum: 0
          maximum: 1
    Camera:
      type: object
      required: [id, name, sourceType, streamKey, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sourceType:
          type: string
          enum: [INTEGRATED, USB, NETWORK_RTSP, DEMO_FILE]
        streamKey:
          type: string
        maskedSource:
          type: string
        status:
          $ref: '#/components/schemas/CameraStatus'
        lastSeenAt:
          type: [string, 'null']
          format: date-time
    CameraUpsert:
      type: object
      additionalProperties: false
      required: [name, sourceType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sourceType:
          type: string
          enum: [INTEGRATED, USB, NETWORK_RTSP, DEMO_FILE]
        sourceUri:
          type: string
          maxLength: 1000
        targetFps:
          type: number
          minimum: 1
          maximum: 30
          default: 5
    CameraProbeResult:
      type: object
      required: [reachable, checkedAt]
      properties:
        reachable:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        width:
          type: integer
        height:
          type: integer
        fps:
          type: number
        message:
          type: string
    StreamTicket:
      type: object
      required: [expiresAt, whepUrl, hlsUrl]
      properties:
        expiresAt:
          type: string
          format: date-time
        whepUrl:
          type: string
          format: uri
        hlsUrl:
          type: string
          format: uri
    Detection:
      type: object
      required: [className, confidence, bboxXyxy]
      properties:
        className:
          type: string
          enum: [fire, smoke]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        bboxXyxy:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
    IncidentSummary:
      type: object
      required: [id, zoneId, zoneName, status, severity, primaryType, startedAt]
      properties:
        id:
          type: integer
          format: int64
        zoneId:
          type: integer
          format: int64
        zoneName:
          type: string
        status:
          $ref: '#/components/schemas/IncidentStatus'
        severity:
          $ref: '#/components/schemas/Severity'
        primaryType:
          type: string
          enum: [FIRE, SMOKE, FIRE_AND_SMOKE]
        startedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: [string, 'null']
          format: date-time
    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/IncidentSummary'
        - type: object
          properties:
            fusionScore:
              type: number
            observations:
              type: array
              items:
                type: object
            semanticAnalysis:
              type: [object, 'null']
            timeline:
              type: array
              items:
                type: object
    IncidentActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [ACKNOWLEDGE, START_HANDLING, RESOLVE, MARK_FALSE_ALARM]
        note:
          type: string
          maxLength: 2000
        falseAlarmReason:
          type: string
          enum: [STEAM, DUST, LIGHT, SCREEN_CONTENT, OTHER]
    DashboardSummary:
      type: object
      required: [onlineCameras, totalCameras, newIncidents, handlingIncidents, todayIncidents]
      properties:
        onlineCameras:
          type: integer
        totalCameras:
          type: integer
        newIncidents:
          type: integer
        handlingIncidents:
          type: integer
        todayIncidents:
          type: integer
