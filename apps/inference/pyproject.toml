[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fire-monitoring-inference"
version = "0.1.0"
description = "Localization, temporal confirmation, pump protocol and Qwen client"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "pydantic>=2.10,<3",
  "pyserial>=3.5,<4",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
yolo = [
  "ultralytics==8.4.100",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fire_monitoring_inference"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
